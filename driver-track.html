<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6d28d9"><title>Driver Live Location | Vijay Connect</title><link rel="icon" href="logo-black.png" type="image/png"><style>body{margin:0;background:#faf8fd;font-family:Inter,Arial,sans-serif;color:#2d2436}.wrap{max-width:560px;margin:30px auto;padding:18px}.card{background:#fff;border:1px solid #e6dcef;border-radius:24px;padding:25px;box-shadow:0 20px 60px #32106412}h1{margin:7px 0;font-size:26px}.muted{color:#887b92;font-size:11px;line-height:1.6}.badge{font-size:9px;letter-spacing:1.7px;color:#5a20d6;font-weight:900}.field{margin-top:15px}.field label{display:block;font-size:10px;font-weight:900;color:#554862}.field input{box-sizing:border-box;width:100%;margin-top:6px;padding:12px;border:1px solid #ded3e9;border-radius:12px;outline:0}.btn{width:100%;border:0;border-radius:12px;padding:13px;margin-top:15px;background:#5a20d6;color:#fff;font-weight:900;cursor:pointer}.btn.stop{background:#9f3150}.status{margin-top:12px;font-size:10px;font-weight:800;min-height:16px}.good{color:#21834a}.warn{color:#b04444}.coords{margin-top:13px;padding:12px;border-radius:12px;background:#faf8fd;border:1px solid #eee7f5;font-size:10px;color:#6e617a}.coords b{color:#4f1ac0}</style></head><body><main class="wrap"><section class="card"><div class="badge">VIJAY CONNECT • DRIVER</div><h1>Start live cab location</h1><p class="muted">Enter the tracking code given for this booking. Keep this page open while driving. Location sharing uses the phone's GPS.</p><div class="field"><label>Tracking code<input id="code" placeholder="VC1234" autocomplete="off"></label></div><div class="field"><label>Driver name<input id="driver" placeholder="Driver name"></label></div><button class="btn" id="start">Start Live Location</button><button class="btn stop" id="stop" style="display:none">Stop Sharing</button><div class="status" id="status"></div><div class="coords" id="coords">GPS: <b>Not started</b></div></section></main><script src="vc-supabase.js"></script><script>
const cfg=window.VC_SUPABASE_CONFIG,base=()=>String(cfg?.url||'').replace(/\/+$/,'');let watch=null,code='';function status(t,c=''){const e=document.getElementById('status');e.textContent=t;e.className='status '+c}async function push(lat,lng){const r=await fetch(base()+'/rest/v1/cab_locations?on_conflict=booking_code',{method:'POST',headers:{apikey:cfg.key,Authorization:'Bearer '+cfg.key,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({booking_code:code,lat,lng,status:'Live',driver_name:document.getElementById('driver').value.trim()||'Vijay Connect Driver',updated_at:new Date().toISOString()})});if(!r.ok)throw new Error('Could not update live location ('+r.status+')')}document.getElementById('start').onclick=()=>{code=document.getElementById('code').value.trim().toUpperCase();if(!code){status('Enter the tracking code.','warn');return}if(!navigator.geolocation){status('This phone does not support GPS location.','warn');return}status('Requesting GPS permission…');watch=navigator.geolocation.watchPosition(async p=>{const lat=p.coords.latitude,lng=p.coords.longitude;document.getElementById('coords').innerHTML='GPS: <b>'+lat.toFixed(6)+', '+lng.toFixed(6)+'</b>';try{await push(lat,lng);status('✓ Live location is being shared.','good')}catch(e){status('⚠️ '+e.message,'warn')}},e=>status('GPS error — '+e.message,'warn'),{enableHighAccuracy:true,maximumAge:5000,timeout:15000});document.getElementById('start').style.display='none';document.getElementById('stop').style.display='block'};document.getElementById('stop').onclick=()=>{if(watch!==null)navigator.geolocation.clearWatch(watch);watch=null;document.getElementById('start').style.display='block';document.getElementById('stop').style.display='none';status('Location sharing stopped.','warn')};const q=new URLSearchParams(location.search);if(q.get('booking'))document.getElementById('code').value=q.get('booking').toUpperCase();
</script></body></html>
